<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FPL AI — Weekly Squad</title>
<style>
  :root{
    --pitch-dark:#0d1f16;
    --pitch:#163a26;
    --pitch-line: rgba(255,255,255,0.14);
    --chalk:#eef3ec;
    --chalk-dim:#9fb3a6;
    --accent:#ff8a3d;
    --accent-dim:#c96b2e;
    --panel:#0f1713;
    --panel-2:#132119;
    --good:#6fd08c;
    --warn:#e0b84a;
    --bad:#ff6b6b;
    --mono: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
    --display: 'Oswald', 'Arial Narrow', sans-serif;
    --body: 'Inter', -apple-system, sans-serif;
  }
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--pitch-dark); color:var(--chalk);
    font-family:var(--body); min-height:100vh;
  }
  header{
    padding:24px 32px 16px; border-bottom:1px solid var(--pitch-line);
    display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:10px;
  }
  header h1{
    font-family:var(--display); font-weight:700; letter-spacing:0.5px;
    font-size:clamp(20px,3vw,28px); margin:0; text-transform:uppercase;
  }
  header h1 span{color:var(--accent);}
  #meta{font-family:var(--mono); color:var(--chalk-dim); font-size:13px;}
  .wrap{display:grid; grid-template-columns: 1.1fr 0.9fr; gap:0; align-items:start;}
  @media (max-width: 900px){ .wrap{grid-template-columns:1fr;} }

  /* PITCH — sized to content, no wasted space */
  .pitch-col{padding:20px;}
  .pitch{
    position:relative; border-radius:10px; overflow:hidden;
    background: repeating-linear-gradient(0deg, var(--pitch) 0px, var(--pitch) 44px, #17402a 44px, #17402a 88px);
    border:1px solid var(--pitch-line);
    max-width:600px; margin:0 auto; padding:18px 8px;
    display:flex; flex-direction:column; gap:4px;
  }
  .row{display:flex; justify-content:space-evenly; align-items:flex-start; gap:4px;}
  .player-chip{
    display:flex; flex-direction:column; align-items:center; gap:2px; cursor:pointer;
    transition:transform .15s ease; padding:4px; border-radius:8px; width:76px;
  }
  .player-chip:hover{transform:translateY(-2px); background:rgba(255,255,255,0.04);}
  .shirt{
    width:36px; height:36px; border-radius:8px; background:var(--panel-2);
    border:1.5px solid var(--pitch-line); display:flex; align-items:center; justify-content:center;
    font-family:var(--mono); font-size:10px; font-weight:600; color:var(--chalk);
    position:relative;
  }
  .player-chip.captain .shirt{ border-color:var(--accent); box-shadow:0 0 0 2px rgba(255,138,61,.25); }
  .cbadge{
    position:absolute; top:-8px; right:-8px; background:var(--accent); color:#1a1006;
    font-size:9px; font-weight:700; width:16px; height:16px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-family:var(--mono);
  }
  .low-conf-badge{
    position:absolute; bottom:-6px; left:-6px; background:var(--warn); color:#1a1006;
    font-size:8px; font-weight:700; width:14px; height:14px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
  }
  .pname{font-size:10px; color:var(--chalk); text-align:center; line-height:1.2; max-width:76px;}
  .pclub{font-size:8.5px; color:var(--chalk-dim); font-family:var(--mono); text-transform:uppercase;}
  .pxp{font-size:9px; color:var(--accent); font-family:var(--mono);}

  .bench-strip{
    max-width:600px; margin:12px auto 0; background:var(--panel); border:1px solid var(--pitch-line);
    border-radius:8px; padding:10px 14px;
  }
  .bench-strip h3{margin:0 0 8px; font-family:var(--display); font-size:11px; letter-spacing:1.5px;
    text-transform:uppercase; color:var(--chalk-dim);}
  .bench-row{display:flex; gap:14px; flex-wrap:wrap;}

  /* SIDEBAR */
  .side{background:var(--panel); border-left:1px solid var(--pitch-line); padding:20px;
        display:flex; flex-direction:column; gap:16px;}
  .card{background:var(--panel-2); border:1px solid var(--pitch-line); border-radius:10px; padding:14px 16px;}
  .card h2{font-family:var(--display); font-size:12px; text-transform:uppercase; letter-spacing:1.5px;
           margin:0 0 10px; color:var(--chalk-dim);}
  .stat-row{display:flex; justify-content:space-between; padding:5px 0; font-size:13.5px;
            border-bottom:1px dashed rgba(255,255,255,0.06);}
  .stat-row:last-child{border-bottom:none;}
  .stat-row b{font-family:var(--mono); color:var(--chalk);}
  .rec{border-left:3px solid var(--accent); padding:10px 12px; background:rgba(255,138,61,0.07);
       border-radius:0 6px 6px 0; font-size:13.5px; line-height:1.5;}
  .rec.hold{border-left-color:var(--chalk-dim); background:rgba(255,255,255,0.03);}
  .flag{font-size:12.5px; color:var(--chalk-dim); padding:5px 0; border-bottom:1px dashed rgba(255,255,255,0.06);}
  .diff-item{display:flex; justify-content:space-between; font-size:12.5px; padding:5px 0;
             border-bottom:1px dashed rgba(255,255,255,0.06);}
  .diff-item .own{color:var(--chalk-dim); font-family:var(--mono); font-size:11.5px;}
  .empty{color:var(--chalk-dim); font-size:13px; padding:20px; text-align:center;}

  /* PLAYER DETAIL PANEL (click a chip) */
  .detail-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.55); display:none;
    align-items:center; justify-content:center; z-index:50; padding:20px;
  }
  .detail-overlay.open{display:flex;}
  .detail-card{
    background:var(--panel-2); border:1px solid var(--pitch-line); border-radius:12px;
    padding:22px; max-width:420px; width:100%; max-height:80vh; overflow-y:auto;
  }
  .detail-card h3{margin:0 0 2px; font-family:var(--display); font-size:20px; text-transform:uppercase;}
  .detail-sub{color:var(--chalk-dim); font-family:var(--mono); font-size:12px; margin-bottom:14px;}
  .detail-stats{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:16px;}
  .dstat{background:var(--panel); border-radius:6px; padding:8px 10px;}
  .dstat .k{font-size:10px; color:var(--chalk-dim); text-transform:uppercase; letter-spacing:0.5px;}
  .dstat .v{font-family:var(--mono); font-size:15px; margin-top:2px;}
  .conf-warning{background:rgba(224,184,74,0.12); border-left:3px solid var(--warn); padding:8px 10px;
                border-radius:0 6px 6px 0; font-size:12.5px; margin-bottom:14px; line-height:1.4;}
  .fixture-list h4{font-size:11px; text-transform:uppercase; color:var(--chalk-dim); margin:0 0 8px;
                    letter-spacing:1px;}
  .fixture-row{display:flex; justify-content:space-between; font-size:13px; padding:5px 0;
               border-bottom:1px dashed rgba(255,255,255,0.06);}
  .fdr-1, .fdr-2{color:var(--good);} .fdr-3{color:var(--warn);} .fdr-4, .fdr-5{color:var(--bad);}
  .close-btn{float:right; background:none; border:none; color:var(--chalk-dim); font-size:20px;
             cursor:pointer; line-height:1;}
  footer{padding:16px 32px; color:var(--chalk-dim); font-size:11.5px; font-family:var(--mono);
         border-top:1px solid var(--pitch-line);}
</style>
</head>
<body>
<header>
  <h1>FPL <span>AI</span> — Weekly Squad</h1>
  <div id="meta">loading…</div>
</header>

<div class="wrap">
  <div class="pitch-col">
    <div class="pitch" id="pitch"></div>
    <div class="bench-strip">
      <h3>Bench</h3>
      <div class="bench-row" id="bench"></div>
    </div>
  </div>

  <div class="side">
    <div class="card" id="summary-card">
      <h2>This Gameweek</h2>
      <div id="summary"></div>
    </div>
    <div class="card" id="rec-card" style="display:none;">
      <h2>Recommendation</h2>
      <div id="rec"></div>
    </div>
    <div class="card" id="flags-card" style="display:none;">
      <h2>Fixture Flags</h2>
      <div id="flags"></div>
    </div>
    <div class="card">
      <h2>Differentials to Watch</h2>
      <div id="diffs"></div>
    </div>
  </div>
</div>

<footer>Data: official FPL API · Model: xG/xA + fixture-adjusted expected points · Click any player for the reasoning behind their pick · Regenerated weekly</footer>

<div class="detail-overlay" id="detailOverlay">
  <div class="detail-card" id="detailCard"></div>
</div>

<script>
const POS_ORDER = {GKP:0, DEF:1, MID:2, FWD:3};
let PLAYER_INDEX = {};

async function load() {
  let data;
  try {
    const res = await fetch('data.json', {cache:'no-store'});
    data = await res.json();
  } catch(e) {
    document.getElementById('pitch').innerHTML = '<div class="empty">No data.json found yet.<br>Run <code>python run_weekly.py</code> to generate your squad.</div>';
    document.getElementById('meta').textContent = 'no data';
    return;
  }
  render(data);
}

function chip(p) {
  const cap = p.captain ? ' captain' : '';
  const lowConf = (p.data_confidence !== undefined && p.data_confidence < 0.4);
  return `<div class="player-chip${cap}" onclick="showDetail(${p.id})">
      <div class="shirt">${p.pos}${p.captain ? '<div class="cbadge">C</div>' : ''}${lowConf ? '<div class="low-conf-badge" title="Thin data sample — treat with caution">!</div>' : ''}</div>
      <div class="pname">${p.name}</div>
      <div class="pclub">${p.team_name || ''}</div>
      <div class="pxp">${p.xp.toFixed(1)} xP</div>
    </div>`;
}

function fdrClass(fdr) { return 'fdr-' + fdr; }

function showDetail(id) {
  const p = PLAYER_INDEX[id];
  if (!p) return;
  const conf = p.data_confidence !== undefined ? p.data_confidence : 1.0;
  const confPct = Math.round(conf * 100);
  const fixturesHtml = (p.fixtures || []).map(f =>
    `<div class="fixture-row"><span>GW${f.gw} vs ${f.opponent} (${f.home ? 'H' : 'A'})</span>
     <span class="${fdrClass(f.fdr)}">FDR ${f.fdr} · ${f.xp.toFixed(1)} xP</span></div>`
  ).join('') || '<div class="fixture-row"><span>No fixture data</span></div>';

  document.getElementById('detailCard').innerHTML = `
    <button class="close-btn" onclick="closeDetail()">×</button>
    <h3>${p.name}</h3>
    <div class="detail-sub">${p.team_name || ''} · ${p.pos} · £${p.cost}m</div>
    ${conf < 0.5 ? `<div class="conf-warning">⚠ Low data confidence (${confPct}%) — this player has a thin minutes sample (${p.career_minutes || 0} career mins), so the projection is less reliable than usual. Worth checking team news before trusting this pick.</div>` : ''}
    <div class="detail-stats">
      <div class="dstat"><div class="k">Expected pts (horizon)</div><div class="v">${p.xp.toFixed(1)}</div></div>
      <div class="dstat"><div class="k">Ownership</div><div class="v">${(p.selected_by || 0).toFixed(1)}%</div></div>
      <div class="dstat"><div class="k">Cost</div><div class="v">£${p.cost}m</div></div>
      <div class="dstat"><div class="k">Data confidence</div><div class="v">${confPct}%</div></div>
    </div>
    <div class="fixture-list">
      <h4>Upcoming Fixtures</h4>
      ${fixturesHtml}
    </div>
  `;
  document.getElementById('detailOverlay').classList.add('open');
}
function closeDetail() { document.getElementById('detailOverlay').classList.remove('open'); }
document.getElementById('detailOverlay').addEventListener('click', (e) => {
  if (e.target.id === 'detailOverlay') closeDetail();
});

function render(d) {
  document.getElementById('meta').textContent = `Gameweek ${d.gameweek} · £${d.total_cost}m spent · £${d.budget_left}m in bank`;

  PLAYER_INDEX = {};
  (d.squad || []).forEach(p => PLAYER_INDEX[p.id] = p);

  const starters = d.starters.slice().sort((a,b)=>POS_ORDER[a.pos]-POS_ORDER[b.pos]);
  const rows = {GKP:[], DEF:[], MID:[], FWD:[]};
  starters.forEach(p => rows[p.pos].push(p));

  const pitch = document.getElementById('pitch');
  pitch.innerHTML = ['FWD','MID','DEF','GKP'].map(pos =>
    rows[pos].length ? `<div class="row">${rows[pos].map(chip).join('')}</div>` : ''
  ).join('');

  document.getElementById('bench').innerHTML = d.bench
    .slice().sort((a,b)=>-a.xp+b.xp).map(chip).join('');

  document.getElementById('summary').innerHTML = `
    <div class="stat-row"><span>Predicted points</span><b>${d.predicted_points.toFixed(1)}</b></div>
    <div class="stat-row"><span>Captain</span><b>${d.captain ? d.captain.name : '—'}</b></div>
    <div class="stat-row"><span>Vice-captain</span><b>${d.vice_captain ? d.vice_captain.name : '—'}</b></div>
    <div class="stat-row"><span>Squad value</span><b>£${d.total_cost}m</b></div>
    <div class="stat-row"><span>In the bank</span><b>£${d.budget_left}m</b></div>
  `;

  if (d.mode === 'transfer_advice') {
    document.getElementById('rec-card').style.display = 'block';
    const worth = d.worth_it;
    document.getElementById('rec').innerHTML = `
      <div class="rec ${worth ? '' : 'hold'}">
        ${worth
          ? `Make <b>${d.transfers_made}</b> transfer(s) this week (hit: -${d.hit_cost} pts).<br>Net expected gain: +${d.net_gain.toFixed(1)} pts over the horizon.`
          : `Hold your squad — no transfer clears the value bar this week.`}
      </div>`;
  }

  if (d.flags && d.flags.length) {
    document.getElementById('flags-card').style.display = 'block';
    document.getElementById('flags').innerHTML = d.flags.map(f => `<div class="flag">${f}</div>`).join('');
  }

  const diffs = d.differentials || [];
  document.getElementById('diffs').innerHTML = diffs.length
    ? diffs.map(p => `<div class="diff-item"><span>${p.name} <span class="own">(${p.pos}, ${p.team_name})</span></span><span class="own">${p.selected_by.toFixed(1)}% · ${p.xp.toFixed(1)} xP</span></div>`).join('')
    : '<div class="empty">None found this week.</div>';
}

load();
</script>
</body>
</html>
